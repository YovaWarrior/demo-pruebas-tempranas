# GitHub Actions: corre los escenarios de Cucumber en cada push y pull request.
name: Pruebas tempranas

on:
  push:
  pull_request:
  workflow_dispatch:   # botón "Run workflow" para lanzarlo a mano desde GitHub

jobs:
  cucumber:
    name: Escenarios BDD (Cucumber)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Correr los escenarios
        run: npm run test:ci
        env:
          FORCE_COLOR: "1"

      - name: Guardar el reporte HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cucumber
          path: reportes/
